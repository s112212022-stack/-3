<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聯華電子 - 國際策略管理期末專案</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            overflow-x: hidden;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 玻璃擬物化特效 */
        .glass-panel {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card {
            background: rgba(31, 41, 55, 0.4);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            background: rgba(31, 41, 55, 0.6);
            border-color: rgba(59, 130, 246, 0.4);
            box-shadow: 0 10px 30px -10px rgba(59, 130, 246, 0.3);
        }
        .wafer-bg {
            background: radial-gradient(circle at 50% 50%, rgba(17, 24, 39, 0.6) 0%, rgba(11, 15, 25, 1) 100%);
        }
        .carousel-container {
            perspective: 1200px;
            transform-style: preserve-3d;
        }
        .carousel-item {
            transition: transform 0.7s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.7s ease, border-color 0.4s ease;
            transform-style: preserve-3d;
            backface-visibility: hidden;
        }
        .page-transition {
            transition: transform 0.6s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.6s ease;
        }
        
        /* 強制展開用樣式 (Click event override) */
        .force-open { max-height: 500px !important; }
        .force-rotate { transform: rotate(180deg) !important; }
    </style>
</head>
<body class="wafer-bg min-h-screen flex flex-col justify-between overflow-hidden">

    <!-- 靜態科技背景線條 -->

                <span class="text-lg font-bold tracking-wider text-white">聯華電子</span>

                    </button>
                    <div id="submenu-com" class="overflow-hidden transition-all duration-500 max-h-0 group-hover:max-h-[500px]">
                        <div class="pl-12 pr-4 py-1 space-y-1.5 border-l-2 border-indigo-500/50 ml-6 mb-2">
                            <button onclick="jumpToSection(1, 'com-overview')" class="flex items-center text-xs text-gray-400 hover:text-indigo-400 py-1.5 transition-all duration-300 w-full text-left font-medium hover:-translate-y-1 hover:scale-105 transform origin-left">
                                <span class="w-1.5 h-1.5 rounded-full bg-indigo-500 mr-2 shrink-0"></span>公司概況

                            <button onclick="jumpToSection(1, 'com-history')" class="flex items-center text-xs text-gray-400 hover:text-indigo-400 py-1.5 transition-all duration-300 w-full text-left font-medium hover:-translate-y-1 hover:scale-105 transform origin-left">

                            </button>
                            <button onclick="jumpToSection(1, 'com-locations')" class="flex items-center text-xs text-gray-400 hover:text-indigo-400 py-1.5 transition-all duration-300 w-full text-left font-medium hover:-translate-y-1 hover:scale-105 transform origin-left">

                            <button onclick="jumpToSection(1, 'com-org')" class="flex items-center text-xs text-gray-400 hover:text-indigo-400 py-1.5 transition-all duration-300 w-full text-left font-medium hover:-translate-y-1 hover:scale-105 transform origin-left">

                            <button onclick="jumpToSection(1, 'com-finance')" class="flex items-center text-xs text-gray-400 hover:text-indigo-400 py-1.5 transition-all duration-300 w-full text-left font-medium hover:-translate-y-1 hover:scale-105 transform origin-left">

                </div>

                <!-- 3. 市場分析 (Hover + Click) -->

                            <svg class="w-5 h-5 text-purple-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>

                            <button onclick="jumpToSection(2, 'market-bmc')" class="flex items-center text-xs text-gray-400 hover:text-purple-400 py-1.5 transition-all duration-300 w-full text-left font-medium hover:-translate-y-1 hover:scale-105 transform origin-left">

                            <button onclick="jumpToSection(2, 'market-trend')" class="flex items-center text-xs text-gray-400 hover:text-purple-400 py-1.5 transition-all duration-300 w-full text-left font-medium hover:-translate-y-1 hover:scale-105 transform origin-left">
                                <span class="w-1.5 h-1.5 rounded-full bg-purple-500 mr-2 shrink-0"></span>產業環境與市場趨勢
                            </button>
                            <button onclick="jumpToSection(2, 'market-competitor')" class="flex items-center text-xs text-gray-400 hover:text-purple-400 py-1.5 transition-all duration-300 w-full text-left font-medium hover:-translate-y-1 hover:scale-105 transform origin-left">
                                <span class="w-1.5 h-1.5 rounded-full bg-purple-500 mr-2 shrink-0"></span>策略群組-競爭者分析

                            <button onclick="jumpToSection(2, 'market-dynamic')" class="flex items-center text-xs text-gray-400 hover:text-purple-400 py-1.5 transition-all duration-300 w-full text-left font-medium hover:-translate-y-1 hover:scale-105 transform origin-left">

                            <button onclick="jumpToSection(2, 'market-pestel')" class="flex items-center text-xs text-gray-400 hover:text-purple-400 py-1.5 transition-all duration-300 w-full text-left font-medium hover:-translate-y-1 hover:scale-105 transform origin-left">

    <!-- 主頁面區域 -->

                landing.style.transform = 'scale(1) translateZ(0)';
                landing.style.opacity = '1';
                updateCarousel();
            }, 50);
        }

        window.onload = function() {
            initCarousel();
            window.focus();
        };
    </script>
</body>
</html>
